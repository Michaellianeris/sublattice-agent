<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpinMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("sublattice.theme")||"light"}catch{}</script>
<style>
:root{
  --paper:#EDF0F3; --panel:#FFFFFF; --ink:#17212B; --muted:#5A6875; --line:#CDD5DD; --soft:#F5F7F9; --grid:#E3E8ED;
  --m1:#1F4FD1; --m2:#B0127F; --ok:#2E7D4F; --warn:#9A5B00; --err:#B42318;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--serif)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--m1);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em}
[hidden]{display:none!important}
sub{font-size:.75em;line-height:0}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
.mark{display:flex;align-items:center;gap:10px}
.mark h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.controls{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pill.good{color:var(--ink)} .pill.good i{background:var(--ok)}
.pill.need{color:var(--warn);border-color:#E6CFA3;background:#FBF4E4} .pill.need i{background:var(--warn)}
.settings{position:relative}
.popover{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;box-shadow:0 10px 28px rgba(23,33,43,.14)}
.popover label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.popover select,.popover input{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--panel);color:var(--ink)}
.popover p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);height:calc(100vh - 57px)}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.bench{overflow-y:auto;padding:20px 24px 40px}

/* conversation */
.log{flex:1;overflow-y:auto;padding:24px 28px}
.msg{max-width:72ch;margin:0 0 18px}
.msg.user{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:10px 14px;width:fit-content;max-width:62ch;white-space:pre-wrap}
.msg.assistant p{margin:.45em 0}
.msg code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:1px 4px;border-radius:3px}
.msg table{border-collapse:collapse;margin:.6em 0;font-size:.92rem}
.msg td,.msg th{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left}
.msg h4{margin:.8em 0 .2em;font-size:1.02rem}
.msg ul,.msg ol{padding-left:1.3em;margin:.4em 0}
.codeblock{border:1px solid var(--line);border-radius:6px;margin:.6em 0;background:var(--soft);overflow:hidden}
.codebar{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.codebar .sp{flex:1}
.codebar button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 8px;font:inherit;cursor:pointer;color:var(--ink)}
.codebar button:hover{border-color:var(--m1)}
.codeblock pre{margin:0;padding:10px 12px;overflow-x:auto;font:13px/1.55 var(--mono)}
.codeblock code{background:none;padding:0;font:inherit}
.attachment{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;color:var(--muted)}
.chip.link{cursor:pointer;color:var(--ink)}
.chip.link:hover{border-color:var(--m1)}
.chip.bad{color:var(--err);border-color:#E7B8B3}
.spin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--m1);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-style:italic;margin:0 0 18px}
.error{color:var(--err);border-left:3px solid var(--err);padding:4px 10px;margin:0 0 18px;max-width:72ch}

.empty{max-width:56ch;margin:8vh auto 0;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.6rem;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.starters{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.starters button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 12px;cursor:pointer}
.starters button:hover{border-color:var(--m1)}

.composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px 14px}
.composer.drag{outline:2px dashed var(--m1);outline-offset:-6px}
.pending{display:flex;gap:8px;margin-bottom:8px}
.pending span{font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--soft)}
.pending button{border:none;background:none;cursor:pointer;color:var(--muted)}
.row{display:flex;gap:10px;align-items:flex-end}
.row textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-height:44px;max-height:180px;background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--m1);border-color:var(--m1);color:#fff}
.btn.primary:hover{background:#173FAA}
.btn.small{padding:3px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

/* bench */
.bench h2{font-size:1.1rem;font-weight:600;margin:0 0 10px}
.runs{list-style:none;margin:0 0 22px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:190px;overflow-y:auto}
.runs li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--soft);cursor:pointer}
.runs li:last-child{border-bottom:none}
.runs li:hover{background:var(--soft)}
.runs li.active{box-shadow:inset 3px 0 0 var(--m1);background:var(--soft)}
.runs .id{font-family:var(--mono);font-size:.82rem}
.runs .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.runs .mini{width:60px;height:3px;background:var(--grid);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.runs .mini i{display:block;height:100%;background:var(--m1)}
.nothing{color:var(--muted);font-size:.92rem;padding:12px}
.status{font-size:.88rem;color:var(--muted)}
.status.done{color:var(--ok)} .status.failed,.status.interrupted{color:var(--err)} .status.running{color:var(--m1)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:none;background:none;padding:8px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--m1);font-weight:600}

.selected{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.sel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sel-head strong{font-size:1.15rem}
.bar{height:4px;background:var(--grid);border-radius:2px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--m1);transition:width .6s}
.warn{color:var(--warn);font-size:.9rem;margin:6px 0 0}

.top{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;margin:14px 0 6px}
.dial svg{width:190px;height:190px;display:block}
.dial-legend{display:flex;gap:12px;font-size:.8rem;color:var(--muted);justify-content:center;margin-top:2px}
.dial-legend b{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.figures{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:.92rem;margin:0}
.figures dt{color:var(--muted)}
.figures dd{margin:0;font-family:var(--mono);font-size:.84rem;text-align:right}

.plotbox{margin-top:12px;border-top:1px solid var(--grid);padding-top:12px}
.plot-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.presets{display:flex;gap:4px}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 9px;font-size:.84rem;cursor:pointer}
.presets button:hover{border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px}
.legend button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 9px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.legend button[aria-pressed=false]{color:var(--muted);background:var(--soft)}
.legend button[aria-pressed=false] svg{opacity:.3}
.legend svg{width:20px;height:8px}
.canvaswrap{width:100%;position:relative}
.canvaswrap canvas{display:block;touch-action:pan-y;cursor:crosshair;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.readout{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;min-height:2.6em;color:var(--ink)}
.readout em{font-style:normal;color:var(--muted)}
.transport{display:flex;align-items:center;gap:8px;margin-top:6px}
.transport input[type=range]{flex:1;min-width:60px;accent-color:var(--m1)}
.transport select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--panel)}
.note{font-size:.8rem;color:var(--muted);margin-top:4px}

.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:.9rem}
.files a{color:var(--m1)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sweep-table{width:100%;border-collapse:collapse;margin-top:10px}
.sweep-table td,.sweep-table th{padding:2px 6px;border-bottom:1px solid var(--soft);font-family:var(--mono);font-size:.8rem;text-align:left}
.sweep-table th{color:var(--muted);font-weight:400}
.inline{font-size:.88rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:8px}
.inline input{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px 6px}

.editor textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:13px/1.6 var(--mono);background:var(--panel)}
.editor .row{align-items:center;flex-wrap:wrap;margin-top:8px}
.editor .row select{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--panel)}
.editor input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:200px;background:var(--panel)}
.check{font-size:.9rem;margin-top:8px}
.check.ok{color:var(--ok)} .check.bad{color:var(--err)}

@media (max-width:900px){
  main{grid-template-columns:1fr;height:auto}
  .chat{height:80vh;border-right:none;border-bottom:1px solid var(--line)}
  .controls{margin-left:0;width:100%}
  .top{grid-template-columns:1fr;justify-items:center}
  .popover{left:0;right:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- v2 look: icon rail, centred hero, floating composer, soft cards ---- */
:root{
  --paper:#F6F7FA; --line:#E3E6EC; --soft:#F3F5F9; --grid:#ECEFF4; --muted:#667085; --ink:#1A2230;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
}
body{display:grid;grid-template-columns:64px minmax(0,1fr);font:15px/1.55 var(--sans);overflow:hidden}
.rail{flex-direction:column;flex-wrap:nowrap;gap:6px;padding:14px 0;border-bottom:none;border-right:1px solid var(--line);height:100vh;justify-content:flex-start;align-items:center}
.rail .mark{margin-bottom:10px}
.rail-sp{flex:1}
.rail-btn{width:40px;height:40px;border:none;background:none;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.rail-btn:hover,.rail-btn[aria-expanded=true]{background:var(--soft);color:var(--ink)}
.rail .pill{padding:0;width:40px;height:26px;justify-content:center;gap:0}
.rail .pill span{display:none}
.rail .pill i{width:10px;height:10px}
.rail .settings{position:relative}
.popover{left:calc(100% + 12px);right:auto;top:auto;bottom:0;border-radius:12px;box-shadow:var(--shadow)}
main{height:100vh;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);background:var(--paper)}
.chat{background:transparent;position:relative}
.log{padding:28px 32px 12px}
.msg,.error{max-width:68ch}
.msg.assistant{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 16px;box-shadow:var(--shadow)}
.msg.user{background:var(--m1);color:#fff;border:none;border-radius:16px 16px 4px 16px}
.msg.user .attachment{color:rgba(255,255,255,.75)}
.chip{background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.thinking{font-style:normal}

.empty{max-width:640px;margin:4vh auto 0;text-align:center}
.empty .hero{width:min(300px,70%);height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 14px rgba(160,90,190,.12))}
.empty .hero .s1{animation:sway 8s ease-in-out infinite;transform-origin:100px 112px}
.empty .hero .s2{animation:sway 8s ease-in-out infinite reverse;transform-origin:242px 112px}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.brand{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;margin:0 0 2px;background:linear-gradient(90deg,#E5341B,#8A3FB5 55%,#1D1DD8);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty h2{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin:4px 0 8px}
.empty p{max-width:52ch;margin:0 auto}
.skills-title{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.skills-title::before,.skills-title::after{content:"";flex:1;border-top:1px solid var(--line)}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:0;text-align:left}
.starters button{display:flex;flex-direction:column;gap:3px;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.starters button:hover{transform:translateY(-2px);border-color:var(--m1)}
.starters b{color:var(--m1);font-size:.9rem}
.starters span{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.composer{border-top:none;background:transparent;padding:6px 24px 18px}
.composer .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px 8px;transition:border-color .15s,box-shadow .15s}
.composer .box:focus-within{border-color:var(--m1);box-shadow:0 0 0 3px rgba(31,79,209,.12),var(--shadow)}
.composer textarea{display:block;width:100%;border:none;outline:none;resize:none;background:transparent;min-height:28px;max-height:180px;padding:2px 4px}
.composer .row{align-items:center;margin-top:4px}
.composer .hint{flex:1;margin:0;font-size:.75rem}
.composer .icon,.composer .send{width:34px;height:34px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer}
.composer .icon{background:none;color:var(--muted)}
.composer .icon:hover{background:var(--soft);color:var(--ink)}
.composer .send{background:var(--m1);color:#fff}
.composer .send:hover{background:#173FAA}
.composer .send:disabled{opacity:.4;cursor:not-allowed}

.bench{background:var(--panel);border-left:1px solid var(--line);padding:24px 28px 40px}
.bench h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.runs{border-radius:12px;box-shadow:none}
.tabs{gap:6px;border-bottom:none;background:var(--soft);padding:4px;border-radius:10px;width:fit-content}
.tabs button{border-radius:7px;padding:5px 16px;border-bottom:none;margin:0}
.tabs button[aria-selected=true]{background:var(--panel);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.selected{border-radius:14px;box-shadow:var(--shadow)}
.btn{border-radius:8px}
.btn.primary{background:var(--m1)}


/* ---- themes ---- */
[data-theme=dark]{--paper:#0E1218;--panel:#171C25;--ink:#E7EBF1;--muted:#9AA4B5;--line:#2A3140;--soft:#1E2430;--grid:#232A36;--m1:#5C7CFF;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
[data-theme=spin]{--paper:#FBF5FC;--panel:#FFFFFF;--ink:#2A1F33;--muted:#7C6B88;--line:#EBD7EF;--soft:#F8EDFA;--grid:#F2E5F5;--m1:#8A3FB5}
[data-theme=dark] .composer .send:hover,[data-theme=dark] .btn.primary:hover{background:#4A68E8}
[data-theme=spin] .composer .send:hover,[data-theme=spin] .btn.primary:hover{background:#70309A}
.lbl-t{font-size:.88rem;color:var(--muted);margin-bottom:6px}
.themes{display:flex;gap:6px;margin-bottom:12px}
.themes button{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 8px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.themes button i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.themes button[aria-pressed=true]{border-color:var(--m1);box-shadow:0 0 0 2px color-mix(in srgb,var(--m1) 25%,transparent)}

/* ---- empty state: composer under the greeting, like Researcher ---- */
.chat.is-empty{justify-content:center;align-items:center;overflow-y:auto}
.chat.is-empty .log,.chat.is-empty .empty{display:contents}
.chat.is-empty .empty>*{order:1;width:min(720px,calc(100% - 48px))}
.chat.is-empty .empty>.hero{width:min(300px,60%)}
.chat.is-empty .empty>.brand{width:auto}
.chat.is-empty .composer{order:2;width:min(720px,100%);flex:none}
.chat.is-empty .empty>.skills-title,.chat.is-empty .empty>.starters{order:3}
.chat.is-empty .empty>.skills-title{margin-top:18px}
.chat.is-empty .empty{text-align:center}
.chat.is-empty .empty>.starters{text-align:left}

/* ---- run cards ---- */
.runcard{max-width:68ch;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 18px}
.rc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc-head .mono{font-weight:600}
.rc-label{color:var(--muted);flex:1}
.steps{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:5px;font-size:.9rem}
.steps li{display:flex;align-items:center;gap:9px;color:var(--muted)}
.steps .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.steps li.done{color:var(--ink)} .steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.done .dot::after{content:"";width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.steps li.active{color:var(--ink)} .steps li.active .dot{border-top-color:var(--m1);animation:spin .8s linear infinite}
.steps li.bad{color:var(--err)} .steps li.bad .dot{border-color:var(--err)}
.runcard .bar{margin:8px 0}
.rc-plot{margin-top:8px;border-top:1px solid var(--grid);padding-top:10px}
.rc-legend{display:flex;gap:14px;font-size:.82rem;margin-bottom:4px}
.rc-meta{margin-top:6px;color:var(--muted);font-size:.78rem;white-space:pre-wrap}

.composer .row .pick{max-width:200px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel);color:var(--ink);font-size:.82rem;text-overflow:ellipsis}
.composer .modes.mini{margin:0;padding:2px}
.composer .modes.mini button{padding:3px 12px;font-size:.82rem}
.composer .row .hint{text-align:right}

.bench-toggle{position:fixed;top:14px;right:18px;z-index:6;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);font-size:.88rem}
.bench-toggle:hover{border-color:var(--m1);color:var(--m1)}
body.bench-open .bench-toggle{display:none}

/* ---- workbench is toggled; default = chat only ---- */
main{grid-template-columns:minmax(0,1fr)}
.bench{display:none}
body.bench-open main{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
body.bench-open .bench{display:block}
.rail-btn[aria-pressed=true]{background:var(--soft);color:var(--m1)}
.chat:not(.is-empty) .log{padding-left:max(24px,calc((100% - 780px)/2));padding-right:max(24px,calc((100% - 780px)/2))}
.chat:not(.is-empty) .composer{width:min(830px,100%);align-self:center}
.bench-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bench-head h2{margin:0}
.modelrow{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);margin-bottom:12px}
.modelrow select{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);color:var(--ink)}
.modes{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:fit-content;margin-bottom:14px}
.modes button{border:none;background:none;border-radius:7px;padding:5px 16px;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--m1);color:var(--m1)}
.frow{display:grid;grid-template-columns:minmax(120px,1fr) 1.6fr 96px;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid);font-size:.9rem}
.frow input[type=range]{width:100%;accent-color:var(--m1)}
.frow input[type=number],.frow input:not([type]),.frow select{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel);color:var(--ink)}
.frow input:not([type]){grid-column:2 / span 2}
.frow select{grid-column:2 / span 2}
.frow span:empty{display:none}
.ftext{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono);white-space:pre-wrap;margin:12px 0}
#fast .row{flex-wrap:wrap;align-items:center}
#fast .row input{border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:200px;background:var(--panel)}

@media (max-width:900px){
  body{grid-template-columns:1fr;overflow:auto}
  .rail{flex-direction:row;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 12px}
  .rail .mark{margin:0}
  .popover{left:auto;right:0;top:calc(100% + 8px);bottom:auto}
  main{height:auto}
  .starters{grid-template-columns:1fr}
}
</style>

<body>
<header class="rail">
  <div class="mark" title="SpinMate">
    <svg width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true">
      <circle cx="-4" r="10" fill="#F6E9F8" stroke="#D9A6E6" stroke-dasharray="2 2"/>
      <circle cx="4" r="10" fill="#F6E9F8" fill-opacity=".7" stroke="#D9A6E6" stroke-dasharray="2 2"/>
      <circle cx="-5" cy="1" r="2.6" fill="#E5341B"/><line x1="-5" y1="1" x2="-3" y2="-6" stroke="#E5341B" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="5" cy="1" r="2.6" fill="#1D1DD8"/><line x1="5" y1="1" x2="3" y2="-6" stroke="#1D1DD8" stroke-width="1.8" stroke-linecap="round" transform="rotate(0)"/>

    </button>
    <div class="popover" id="settingspanel" role="dialog" aria-label="Settings" hidden>
      <div class="lbl-t">Colour theme</div>

        <button type="button" data-theme="dark" aria-pressed="false"><i style="background:#171C25"></i>Dark</button>
        <button type="button" data-theme="spin" aria-pressed="false"><i style="background:linear-gradient(135deg,#E5341B,#8A3FB5 55%,#1D1DD8)"></i>Spin</button>
      </div>

      <p>The key stays in this browser tab and is sent only to your own server.</p>
    </div>

</header>

<button class="bench-toggle" id="benchbtn" type="button" title="Show the workbench (runs, results, setup)" aria-label="Show the workbench" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg>
  <span>Workbench</span>
</button>

<main>
  <section class="chat" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="composer" id="composer">
      <div class="pending" id="pending" hidden></div>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Describe a run, attach a parameter file, or ask about a result" aria-label="Message"></textarea>

<script>
const $ = s => document.querySelector(s);
const state = {messages: [], live: [], busy: false, pending: null, selected: null, runs: [], sweeps: [],
               config: {}, examples: [], error: null, discard: 0, cards: []};

// ---------------------------------------------------------------- api
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const isJson = (res.headers.get("content-type") || "").includes("json");
  const body = isJson ? await res.json() : await res.text();
  if (!res.ok) throw new Error((body && (body.error || body.detail)) || res.statusText);
  return body;
}
const postJson = (path, data) =>
  api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});

// ---------------------------------------------------------------- small markdown
function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function md(text) {
  const out = []; const lines = esc(text).split("\n"); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const lang = l.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      const isParams = buf.some(x => x.trim()) && buf.every(x => !x.trim() || /^\s*(--|#)/.test(x));
      out.push(`<div class="codeblock"><div class="codebar"><span>${lang || "text"}</span><span class="sp"></span>` +
        (isParams ? `<button type="button" data-act="editor">Open in editor</button>` : "") +
        `<button type="button" data-act="copy">Copy</button></div><pre><code>${buf.join("\n")}</code></pre></div>`);
      continue;
    }
    if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = "<table><tr>" + cells(l).map(c => `<th>${c}</th>`).join("") + "</tr>"; i += 2;
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) html += "<tr>" + cells(lines[i++]).map(c => `<td>${c}</td>`).join("") + "</tr>";
      out.push(html + "</table>"); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h4>${inline(h[2])}</h4>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join("<br>"))}</p>`);
  }
  return out.join("");
}

// ---------------------------------------------------------------- conversation
const TOOL_UI = {
  list_input_files: {run: () => "Listing files", done: () => "Listed files"},
  read_input_file: {run: a => `Reading ${a.name}`, done: a => `Read ${a.name}`},
  save_input_file: {run: a => `Saving ${a.name}`, done: a => `Saved ${a.name}`},
  validate_parameters: {run: () => "Checking parameters", done: () => "Checked parameters"},
  start_simulation: {run: () => "Starting run", done: (a, r) => r.run_id ? `Started ${r.run_id}` : "Started run"},
  start_sweep: {run: a => `Starting sweep of ${a.parameter}`, done: (a, r) => r.sweep_id ? `Started ${r.sweep_id} (${r.runs} runs)` : `Started sweep of ${a.parameter}`},
  get_run: {run: a => `Looking at ${a.run_id}`, done: a => `Looked at ${a.run_id}`},
  get_sweep: {run: a => `Looking at ${a.sweep_id}`, done: a => `Looked at ${a.sweep_id}`},
  list_runs: {run: () => "Listing runs", done: () => "Listed runs"},
  cancel_run: {run: a => `Cancelling ${a.run_id}`, done: a => `Cancelled ${a.run_id}`},
};

function toolResults(messages) {
  const map = {};
  for (const m of messages) if (m.role === "user" && Array.isArray(m.content))
    for (const b of m.content) if (b.type === "tool_result") {
      const txt = typeof b.content === "string" ? b.content : (b.content.find(x => x.type === "text") || {}).text || "";
      try { map[b.tool_use_id] = JSON.parse(txt); } catch { map[b.tool_use_id] = {}; }
    }
  return map;
}

function chipFor(name, input, result, running) {
  const ui = TOOL_UI[name] || {run: () => name, done: () => name};
  const c = document.createElement("span"); c.className = "chip";
  if (running) {
    c.innerHTML = `<span class="spin"></span>`;
    c.appendChild(document.createTextNode(ui.run(input) + "…"));
    return c;
  }
  let label = ui.done(input, result);
  const target = result.run_id || result.sweep_id || input.run_id || input.sweep_id;
  if (result.ok === false || result.error) { c.classList.add("bad"); label += ": " + (result.error || "failed"); }
  c.textContent = label;
  if (target && !result.error && result.ok !== false) { c.classList.add("link"); c.tabIndex = 0; c.onclick = () => select(target); c.onkeydown = e => { if (e.key === "Enter") select(target); }; }
  return c;
}

function render() {
  const log = $("#log"); log.innerHTML = "";
  const isEmpty = !state.messages.length && !state.live.length && !state.busy && !state.cards.length;
  $(".chat").classList.toggle("is-empty", isEmpty);
  if (isEmpty) { log.appendChild(emptyState()); return; }
  const results = toolResults(state.messages);
  const add = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; log.appendChild(d); return d; };
  for (const m of state.messages) {
    if (m.role === "user") {
      if (typeof m.content === "string") { addUser(m.content); continue; }
      const texts = m.content.filter(b => b.type === "text").map(b => b.text);
      if (texts.length) addUser(texts.join("\n"));
      continue;
    }
    const blocks = Array.isArray(m.content) ? m.content : [{type: "text", text: m.content}];
    let chips = null;
    for (const b of blocks) {
      if (b.type === "text" && b.text.trim()) { chips = null; add("msg assistant", md(b.text)); }
      else if (b.type === "tool_use") {
        if (!chips) { chips = document.createElement("div"); chips.className = "tools"; log.appendChild(chips); }
        chips.appendChild(chipFor(b.name, b.input || {}, results[b.id] || {}, false));
      }
    }
  }
  let chips = null;
  for (const it of state.live) {
    if (it.kind === "text") { chips = null; add("msg assistant", md(it.text)); }
    else {
      if (!chips) { chips = document.createElement("div"); chips.className = "tools"; log.appendChild(chips); }
      chips.appendChild(chipFor(it.name, it.input, it.event || {}, it.status === "running"));
    }
  }
  for (const id of state.cards) log.appendChild(cardEls.get(id).el);
  if (state.busy && !state.live.some(x => x.status === "running"))
    add("thinking", `<span class="spin"></span>Working…`);
  if (state.error) add("error", esc(state.error));
  log.scrollTop = log.scrollHeight;
}

function addUser(text) {
  const d = document.createElement("div"); d.className = "msg user";
  const m = text.match(/^Attached parameter file `([^`]+)`:\n```\n[\s\S]*?\n```\n?([\s\S]*)$/);
  if (m) {
    d.textContent = m[2].trim() || "(file only)";
    const a = document.createElement("div"); a.className = "attachment"; a.textContent = "attached " + m[1]; d.appendChild(a);
  } else d.textContent = text;
  $("#log").appendChild(d);
}

function emptyState() {
  const d = document.createElement("div"); d.className = "empty";
  d.innerHTML = `<div class="brand">SpinMate</div><svg class="hero" viewBox="0 0 340 200" aria-hidden="true">
      <defs>
        <radialGradient id="gr" cx="35%" cy="30%"><stop offset="0" stop-color="#FF7A5C"/><stop offset="1" stop-color="#C21B00"/></radialGradient>
        <radialGradient id="gb" cx="35%" cy="30%"><stop offset="0" stop-color="#6A6AFF"/><stop offset="1" stop-color="#0A0A9E"/></radialGradient>
        <clipPath id="lens"><circle cx="115" cy="100" r="92"/></clipPath>
      </defs>
      <circle cx="115" cy="100" r="92" fill="#F6E9F8" fill-opacity=".8" stroke="#D9A6E6" stroke-dasharray="5 4"/>
      <circle cx="225" cy="100" r="92" fill="#F6E9F8" fill-opacity=".8" stroke="#D9A6E6" stroke-dasharray="5 4"/>
      <circle cx="225" cy="100" r="92" fill="#E9C9F0" fill-opacity=".85" clip-path="url(#lens)"/>
      <text x="108" y="38" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#2A2A33">S<tspan font-size="13" dy="4">1</tspan></text>
      <text x="232" y="38" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#2A2A33">S<tspan font-size="13" dy="4">2</tspan></text>
      <g class="s1"><line x1="102" y1="120" x2="116" y2="68" stroke="#E5341B" stroke-width="7" stroke-linecap="round"/><path d="M122 52 L103 70 L128 74Z" fill="#E5341B"/><circle cx="100" cy="112" r="14" fill="url(#gr)"/></g>
      <g class="s2"><line x1="240" y1="120" x2="226" y2="68" stroke="#1D1DD8" stroke-width="7" stroke-linecap="round"/><path d="M220 52 L212 74 L238 70Z" fill="#1D1DD8"/><circle cx="242" cy="112" r="14" fill="url(#gb)"/></g>
    </svg>
    <h2>Hi, what shall we simulate?</h2>
    <p>Describe the conditions in words or attach a parameter file. The agent checks them with the solver's own parser, runs the two-sublattice macrospin model, and explains the result from the real dynamics.</p>
    <div class="skills-title"><span>Find a skill</span></div>
    <div class="starters"></div>`;
  const starters = [
    ["Parameters", "Explain which parameters I can set and their units."],

// ---------------------------------------------------------------- sending (streamed)
function stripImages(messages) {
  return messages.map(m => !Array.isArray(m.content) ? m : {...m, content: m.content.map(b =>
    b.type === "tool_result" && Array.isArray(b.content)
      ? {...b, content: b.content.map(x => x.type === "image" ? {type: "text", text: "[plot shown earlier]"} : x)} : b)});
}
function persist() { try { localStorage.setItem("sublattice.chat", JSON.stringify(stripImages(state.messages))); } catch {} }

function onEvent(ev) {
  if (ev.type === "text") { state.live.push({kind: "text", text: ev.text}); }
  else if (ev.type === "tool_start") { state.live.push({kind: "tool", id: ev.id, name: ev.name, input: ev.input, status: "running"}); }
  else if (ev.type === "tool_done") {
    const it = state.live.find(x => x.id === ev.id);
    if (it) { it.status = "done"; it.event = ev.event; }
    const target = ev.event && (ev.event.run_id || ev.event.sweep_id);
    if (target && ["start_simulation", "start_sweep"].includes(ev.event.tool)) { select(target); refreshRuns(); if (ev.event.run_id) trackRun(ev.event.run_id); }
  }
  else if (ev.type === "done") { state.messages = ev.messages; state.live = []; state.finished = true; }
  else if (ev.type === "error") { throw new Error(ev.error); }
  render();
}

async function readStream(res) {
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
  if (buf.trim()) onEvent(JSON.parse(buf));
}

async function send() {
  const text = $("#input").value.trim();
  if (state.busy || (!text && !state.pending)) return;
  let content = text;
  if (state.pending) content = "Attached parameter file `" + state.pending.name + "`:\n```\n" + state.pending.text.trim() + "\n```\n" + text;
  state.messages.push({role: "user", content});
  $("#input").value = ""; autosize(); setPending(null);
  state.busy = true; state.error = null; state.live = []; state.finished = false; render(); toggle();
  try {
    const headers = {"Content-Type": "application/json"};
    const key = $("#apikey").value.trim(); if (key) headers["X-Api-Key"] = key;
    const res = await fetch("/api/chat", {method: "POST", headers, body: JSON.stringify({messages: state.messages, model: $("#model").value, mode: localStorage.getItem("sublattice.mode") === "deep" ? "deep" : "fast"})});
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(b.error || b.detail || res.statusText); }
    await readStream(res);
    if (!state.finished) throw new Error("The connection closed before the answer was complete.");
  } catch (e) {
    if (state.messages.length && state.messages[state.messages.length - 1].role === "user") state.messages.pop();
    $("#input").value = text; state.live = []; state.error = e.message;
  }
  state.busy = false; persist(); render(); toggle(); refreshRuns();
}
function toggle() { $("#send").disabled = state.busy; }

function niceTicks(lo, hi, n = 6) {

  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;

}

    canvas.addEventListener("dblclick", () => this.o.onReset && this.o.onReset());

    c.textAlign = "center"; c.textBaseline = "top";

    c.fillStyle = tc("--ink"); c.textBaseline = "alphabetic"; c.fillText(this.o.xLabel, (l + W - r) / 2, H - 6);

    c.save(); c.beginPath(); c.rect(l, t, W - l - r, H - t - b); c.clip();

      const col = s.c === "#17212B" ? tc("--ink") : s.c; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = s.width || 1.4; c.setLineDash(this.o.points ? [] : (s.dash || []));

      c.stroke(); c.setLineDash([]);

  const cols = {m1x: d.m1x, m1y: d.m1y, m1z: d.m1z, m2x: d.m2x, m2y: d.m2y, m2z: d.m2z};
  for (const a of "xyz") cols["n" + a] = d["m1" + a].map((v, i) => (v - d["m2" + a][i]) / 2);
  view.data = {t: d.t_ns, cols}; view.zoom = zoom;
  view.chart.setData(d.t_ns, CH.map(ch => ({...ch, y: cols[ch.k], visible: prefs[ch.k]})));
  // trail of the tips in the x-z projection; broken wherever neighbouring samples are too far apart
  // to be connected honestly (the motion between them is faster than the sampling shown)
  let gaps = 0;
  const trail = k => {
    let path = "", pen = false;
    for (let i = 0; i < d.t_ns.length; i++) {
      let ok = i > 0;
      if (ok) { const dot = cols[k + "x"][i] * cols[k + "x"][i - 1] + cols[k + "y"][i] * cols[k + "y"][i - 1] + cols[k + "z"][i] * cols[k + "z"][i - 1]; ok = Math.acos(Math.max(-1, Math.min(1, dot))) < 0.35; }
      if (!ok && i > 0) gaps++;
      path += `${ok && pen ? "L" : "M"}${(cols[k + "x"][i] * R).toFixed(1)},${(-cols[k + "z"][i] * R).toFixed(1)}`;
      pen = true;
    }
    return path;
  };
  view.dial.t1.setAttribute("d", trail("m1")); view.dial.t2.setAttribute("d", trail("m2"));
  $("#scrub").max = d.t_ns.length - 1; view.hover = null; view.pos = d.t_ns.length - 1; stopPlay(); setIdx(view.pos);
  $("#resetzoom").hidden = !zoom;
  note.textContent = (zoom ? `Window ${zoom[0].toFixed(3)}–${zoom[1].toFixed(3)} ns. ` : "") +
    (d.n_returned < d.n_window ? `Showing ${d.n_returned.toLocaleString()} of ${d.n_window.toLocaleString()} points; drag to zoom for detail. ` : "") +
    (gaps ? "Parts of the dial trail are not drawn where the motion is faster than the sampling; zoom in to resolve them. " : "") +
    "Click to move the playhead, drag to zoom, double-click to reset.";
}

function updateProgress(r) {

function renderSweep(box, s) {
  const c = s.status_counts || {}, done = c.done || 0, total = s.run_ids.length;
  const isFreq = /Fr$/.test(s.parameter), scale = isFreq ? 1e9 : 1;
  const rows = s.rows.filter(r => r.neel_z_abs_mean !== undefined).sort((p, q) => p.value - q.value);
  box.innerHTML = `
    <div class="sel-head"><strong class="mono">${s.id}</strong><span>Sweep of ${esc(s.parameter)}${s.label ? ", " + esc(s.label) : ""}</span>

    <div class="bar"><i style="width:${(100 * done / total).toFixed(1)}%"></i></div>
    ${rows.length ? `<div class="plotbox"><div class="canvaswrap"><canvas id="schart" role="img" aria-label="Mean |n_z| versus ${esc(s.parameter)}"></canvas></div>

    <label class="inline">Ignore the first <input id="discard" type="number" min="0" max="90" step="5" value="${Math.round(state.discard * 100)}"> % of each run (transient)</label>
    <table class="sweep-table"><tr><th>${esc(s.parameter)}</th><th>run</th><th>status</th><th>mean |n_z|</th></tr>
      ${s.rows.map(r => `<tr><td>${eng(r.value)}</td><td><a href="#" data-run="${r.run_id}">${r.run_id}</a></td><td>${r.status}</td><td>${fmt(r.neel_z_abs_mean)}</td></tr>`).join("")}</table>
    <div class="actions">${done === total ? `<button class="btn" id="analyse" type="button">Ask the assistant to analyse ${s.id}</button>` : ""}</div>`;
  if (rows.length) {
    view.sweepChart = new Chart($("#schart"), {
      height: 230, points: true, xLabel: s.parameter + (isFreq ? " (GHz)" : ""), yLabel: "mean |n_z|",
      xFmt: isFreq ? null : eng,
      onHover: i => { $("#sreadout").innerHTML = i === null ? `<span><em>Hover a point; click it to open that run.</em></span>`
        : `<span>${esc(s.parameter)} = ${isFreq ? +(rows[i].value / 1e9).toPrecision(5) + " GHz" : eng(rows[i].value)}</span><span>mean |n<sub>z</sub>| = ${fmt(rows[i].neel_z_abs_mean)}</span><span><em>${rows[i].run_id}</em></span>`; },
      onClick: i => select(rows[i].run_id),
    });
    view.sweepChart.setData(rows.map(r => r.value / scale), [{k: "y", c: "#1F4FD1", y: rows.map(r => r.neel_z_abs_mean), width: 1.4}]);
  }
  box.querySelectorAll("[data-run]").forEach(a => a.onclick = e => { e.preventDefault(); select(a.dataset.run); });
  const a = $("#analyse"); if (a) a.onclick = () => { $("#input").value = `Analyse sweep ${s.id}.`; send(); };
  $("#discard").onchange = e => { state.discard = Math.max(0, Math.min(0.9, (+e.target.value || 0) / 100)); renderSelected(true); };
}

async function renderSelected(force = false) {
  const id = state.selected; if (!id) return;
  const token = ++view.token, box = $("#selected");
  try {
    const isSweep = id.startsWith("s");
    const data = await api(isSweep ? `/api/sweeps/${id}?discard_fraction=${state.discard}` : `/api/runs/${id}`);
    if (token !== view.token || id !== state.selected) return;
    const sig = isSweep ? `${id}:${state.discard}:${JSON.stringify(data.status_counts)}` : `${id}:${data.status}`;
    if (!force && view.sig === sig) { if (!isSweep && ["running", "queued"].includes(data.status)) updateProgress(data); return; }
    if (view.chart) { view.chart.destroy(); view.chart = null; } if (view.sweepChart) { view.sweepChart.destroy(); view.sweepChart = null; }
    stopPlay(); view.data = null; view.dial = null; view.id = id; view.sig = sig;
    isSweep ? renderSweep(box, data) : renderRun(box, data);
  } catch (e) { box.innerHTML = `<div class="nothing">${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- run list
async function refreshRuns() {
  try {
    const out = await api("/api/runs");
    state.runs = out.runs; state.sweeps = out.sweeps; renderRuns(); updateCards();
    if (state.selected) await renderSelected();
  } catch {}
}
function renderRuns() {
  const ul = $("#runs"); ul.innerHTML = "";
  const items = [...state.sweeps.map(s => ({kind: "sweep", ...s})), ...state.runs.filter(r => !r.sweep_id).map(r => ({kind: "run", ...r}))]
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  if (!items.length) { ul.innerHTML = `<li class="nothing">No runs yet.</li>`; return; }
  for (const it of items) {
    const li = document.createElement("li"); li.tabIndex = 0;
    if (it.id === state.selected) li.classList.add("active");
    let right;
    if (it.kind === "sweep") right = `<span class="status">${it.done}/${it.runs} done</span>`;
    else if (it.status === "running") right = `<span class="mini"><i style="width:${(it.progress * 100).toFixed(0)}%"></i></span><span class="status running">${(it.progress * 100).toFixed(0)}%</span>`;
    else right = `<span class="status ${it.status}">${it.status}</span>`;
    const label = it.kind === "sweep" ? `Sweep of ${it.parameter}${it.label ? ", " + it.label : ""}` : (it.label || "untitled");
    li.innerHTML = `<span class="id">${it.id}</span><span class="lbl">${esc(label)}</span><span>${right}</span>`;
    li.onclick = () => select(it.id);
    li.onkeydown = e => { if (e.key === "Enter") select(it.id); };
    ul.appendChild(li);
  }
}
async function select(id) {
  const changed = state.selected !== id;
  setBench(true);
  if (changed) { resetView(); state.selected = id; }
  showTab("result"); renderRuns(); await renderSelected(changed);
}

// ---------------------------------------------------------------- tabs, editor
function showTab(name) {
  for (const t of ["result", "params"]) {
    $("#tab-" + t).setAttribute("aria-selected", String(t === name));
    $("#panel-" + t).hidden = t !== name;
  }
}
$("#tab-result").onclick = () => showTab("result");
$("#tab-params").onclick = () => showTab("params");
document.querySelector(".tabs").addEventListener("keydown", e => {

});

function showCheck(r, el = $("#checkout")) {
  if (!r) { el.className = "check"; el.textContent = ""; return; }
  if (!r.ok) { el.className = "check bad"; el.textContent = r.error; return; }
  el.className = "check ok";
  const changed = Object.entries(r.changed_from_defaults || {}).map(([k, v]) => `${k}=${Array.isArray(v) ? v.join(",") : v}`).join("  ");
  el.innerHTML = `Valid. ${r.steps.toLocaleString()} steps, about ${dur(r.estimated_runtime_s)}.` +
    (changed ? `<div class="mono" style="color:var(--muted);margin-top:4px">${esc(changed)}</div>` : "") +
    (r.warnings || []).map(w => `<p class="warn">${esc(w)}</p>`).join("");
}
$("#check").onclick = async () => { try { showCheck(await postJson("/api/validate", {parameters_text: $("#params").value})); } catch (e) { showCheck({ok: false, error: e.message}); } };
async function runText(text, label, show) {
  try {
    const chk = await postJson("/api/validate", {parameters_text: text}); show(chk);
    if (!chk.ok) return;
    const out = await postJson("/api/runs", {parameters_text: text, label});
    trackRun(out.run_id, label); await refreshRuns(); select(out.run_id);
  } catch (e) { show({ok: false, error: e.message}); }
}
$("#run").onclick = () => runText($("#params").value, $("#label").value, r => showCheck(r));
$("#save").onclick = async () => {
  const name = prompt("File name", ($("#label").value || "parameters").replace(/\s+/g, "_") + ".txt");
  if (!name) return;
  const out = await postJson("/api/files/save", {name, parameters_text: $("#params").value});
  window.location = `/api/files/${encodeURIComponent(out.name)}`;
};
$("#examples").onchange = e => {
  const ex = state.examples.find(x => x.name === e.target.value);
  if (ex) { $("#params").value = ex.text; $("#label").value = ex.name.replace(".txt", "").replace(/_/g, " "); showCheck(null); }
  e.target.value = "";
};


// ---------------------------------------------------------------- run cards in the chat (process, then graph)
const cardEls = new Map();
const CARD_SERIES = [{k: "m1z", c: "#1F4FD1"}, {k: "m2z", c: "#B0127F"}, {k: "nz", c: "#17212B"}];
function trackRun(id, label) {
  if (cardEls.has(id)) return;
  setBench(true);
  const el = document.createElement("div"); el.className = "runcard";
  el.innerHTML = `<div class="rc-head"><span class="mono">${id}</span><span class="rc-label">${esc(label || "")}</span><span class="status" data-r="st"></span></div>
    <ul class="steps"><li data-s="check"></li><li data-s="start"></li><li data-s="sim"></li><li data-s="plot"></li></ul>
    <div class="bar"><i data-r="bar" style="width:0"></i></div>
    <div class="rc-plot" hidden><div class="rc-legend"><span style="color:#1F4FD1">m<sub>1z</sub></span><span style="color:#B0127F">m<sub>2z</sub></span><span>n<sub>z</sub></span></div>
      <div class="canvaswrap"><canvas role="img" aria-label="Trajectory of ${id}"></canvas></div><div class="rc-meta mono"></div></div>
    <div class="actions"><button class="btn small" type="button" data-r="open">Open full viewer</button></div>`;
  el.querySelector("[data-r=open]").onclick = () => select(id);
  cardEls.set(id, {el, chart: null, final: false}); state.cards.push(id);
  setStep(el, "check", "done", "Parameters checked"); setStep(el, "start", "done", `Run ${id} started`);
  setStep(el, "sim", "active", "Waiting for the solver"); setStep(el, "plot", "wait", "Plot the trajectory");
  render(); updateCards();
}
function setStep(el, k, st, text) { const li = el.querySelector(`[data-s=${k}]`); li.className = st; li.innerHTML = `<span class="dot"></span>${text}`; }
function clearCards() { for (const c of cardEls.values()) c.chart && c.chart.destroy(); cardEls.clear(); state.cards = []; }
async function updateCards() {
  for (const id of state.cards) {
    const c = cardEls.get(id); if (!c || c.final || c.busy) continue;
    c.busy = true;
    try { await paintCard(id, c, await api(`/api/runs/${id}`)); } catch {}
    c.busy = false;
  }
}
async function paintCard(id, c, r) {
  const el = c.el, st = el.querySelector("[data-r=st]"), bar = el.querySelector("[data-r=bar]");
  st.textContent = statusText(r); st.className = "status " + r.status;
  bar.style.width = (r.status === "done" ? 100 : r.progress * 100).toFixed(1) + "%";
  if (r.status === "queued") setStep(el, "sim", "active", `Queued, estimated ${dur(r.estimated_runtime_s)}`);
  else if (r.status === "running") setStep(el, "sim", "active", `Simulating, ${(r.progress * 100).toFixed(0)}%${r.eta_s ? ", about " + dur(r.eta_s) + " left" : ""}`);
  else if (r.status === "done") setStep(el, "sim", "done", `Simulated${r.summary ? " in " + dur(r.summary.runtime_s) : ""}`);
  else { setStep(el, "sim", "bad", "Run " + r.status); setStep(el, "plot", "bad", "No trajectory"); c.final = true; return; }
  if (r.status !== "done" || !r.summary) return;
  c.final = true;
  setStep(el, "plot", "active", "Plotting the trajectory");
  const plot = el.querySelector(".rc-plot"); plot.hidden = false;
  try {
    const d = await api(`/api/runs/${id}/series?points=1200`);
    const cols = {m1z: d.m1z, m2z: d.m2z, nz: d.m1z.map((v, i) => (v - d.m2z[i]) / 2)};
    c.chart = new Chart(plot.querySelector("canvas"), {height: 210, xLabel: "time (ns)", yLabel: "M / Ms", yMin: -1.05, yMax: 1.05});
    c.chart.setData(d.t_ns, CARD_SERIES.map(s => ({...s, y: cols[s.k]})));
    setStep(el, "plot", "done", "Trajectory ready");
    const s = r.summary;
    plot.querySelector(".rc-meta").textContent = `${s.order_final ? s.order_initial + " → " + s.order_final + "   " : ""}mean |nz| = ${fmt(s.neel_z_abs_mean)}   nz sign changes = ${s.neel_z_sign_changes}   n final = ${vec(s.neel_final)}`;
  } catch (e) { setStep(el, "plot", "bad", "Trajectory not available: " + esc(e.message)); }
}

const FAST = [
  {k: "t", label: "Duration (ns)", scale: 1e-9, min: 0.5, max: 30, step: 0.5},
  {k: "Ms", label: "Saturation Ms (kA/m)", scale: 1e3, min: 100, max: 1200, step: 1},

const fnum = v => String(+Number(v).toPrecision(6));
function buildFast() {
  const D = state.config.defaults || {}, form = $("#fform"); form.innerHTML = "";
  for (const f of FAST) {
    const def = (D[f.k] ?? 0) / f.scale, row = document.createElement("div"); row.className = "frow";
    row.innerHTML = `<label for="f-${f.k}">${f.label}</label>
      <input type="range" id="r-${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${fnum(def)}" aria-label="${f.label} slider">
      <input type="number" id="f-${f.k}" step="any" value="${fnum(def)}">`;
    const r = row.querySelector("[type=range]"), n = row.querySelector("[type=number]");
    r.oninput = () => { n.value = fnum(r.value); fastUpdate(); };
    n.oninput = () => { r.value = n.value; fastUpdate(); };
    form.appendChild(row);
  }
  $("#f-neel").onchange = fastUpdate; $("#f-extra").oninput = fastUpdate; fastUpdate();
}
function fastSet(k, v) { const n = $("#f-" + k), r = $("#r-" + k); n.value = fnum(v); r.value = n.value; }
function fastText() {
  const D = state.config.defaults || {}, lines = ["# fast mode: only values that differ from the defaults"];
  for (const f of FAST) {
    const v = parseFloat($("#f-" + f.k).value); if (!isFinite(v)) continue;
    const def = (D[f.k] ?? 0) / f.scale;
    if (Math.abs(v - def) > 1e-9 * Math.max(1, Math.abs(def))) lines.push(`--${f.k}=${+(v * f.scale).toPrecision(8)}`);
  }
  if (parseFloat($("#f-Temp").value) > 0) lines.push("--flag0");
  if ($("#f-neel").value === "plus") lines.push("--m1=0.25,0.0,0.968", "--m2=-0.256,0.0,-0.965");
  const extra = $("#f-extra").value.trim(); if (extra) lines.push(...extra.split(/\s+(?=--)/));
  return lines.join("\n") + "\n";
}
function fastUpdate() { $("#ftext").textContent = fastText(); $("#fcheckout").textContent = ""; $("#fcheckout").className = "check"; }
const baseFast = () => { buildFast(); $("#f-neel").value = "minus"; $("#f-extra").value = ""; };
const PRESETS_FAST = {
  default: () => { baseFast(); fastSet("A0", 0.248); fastSet("t", 2); },
  afm: () => { baseFast(); fastSet("t", 2); },
  minus: () => { baseFast(); fastSet("SOT_DC_Amp", 0); },
  plus: () => { baseFast(); fastSet("SOT_DC_Amp", 0); $("#f-neel").value = "plus"; },
  sotp: () => { baseFast(); fastSet("SOT_DC_Amp", 30); },
  sotn: () => { baseFast(); fastSet("SOT_DC_Amp", -30); },
};
document.querySelectorAll("#fpresets button").forEach(b => b.onclick = () => {
  PRESETS_FAST[b.dataset.p](); fastUpdate();
  $("#f-label").value = b.textContent.replace(/\s+/g, " ").trim();
});
$("#fcheck").onclick = async () => { try { showCheck(await postJson("/api/validate", {parameters_text: fastText()}), $("#fcheckout")); } catch (e) { showCheck({ok: false, error: e.message}, $("#fcheckout")); } };
$("#frun").onclick = () => runText(fastText(), $("#f-label").value, r => showCheck(r, $("#fcheckout")));
$("#fdeep").onclick = () => { $("#params").value = fastText(); $("#label").value = $("#f-label").value; setMode("deep"); showCheck(null); };
function setMode(m) {
  $("#fast").hidden = m !== "fast"; $("#deep").hidden = m !== "deep";
  for (const p of ["", "c"]) { $(`#${p}mode-fast`).setAttribute("aria-pressed", String(m === "fast")); $(`#${p}mode-deep`).setAttribute("aria-pressed", String(m === "deep")); }
  try { localStorage.setItem("sublattice.mode", m); } catch {}
}
$("#mode-fast").onclick = () => setMode("fast");
$("#mode-deep").onclick = () => setMode("deep");
$("#cmode-fast").onclick = () => setMode("fast");
$("#cmode-deep").onclick = () => setMode("deep");

// ---------------------------------------------------------------- settings
function keyState() {
  const k = $("#apikey").value.trim(), pill = $("#keypill"), txt = $("#keytext");
  if (k) { txt.textContent = "Key set for this tab"; pill.className = "pill good"; }
  else if (state.config.has_server_key) { txt.textContent = "Using the server key"; pill.className = "pill good"; }
  else { txt.textContent = "Add an API key"; pill.className = "pill need"; }
}
function toggleSettings(open) {
  const panel = $("#settingspanel"), want = open === undefined ? panel.hidden : open;
  panel.hidden = !want; $("#settingsbtn").setAttribute("aria-expanded", String(want));
  if (want) $("#apikey").focus();
}
$("#settingsbtn").onclick = () => toggleSettings();
$("#keypill").onclick = () => toggleSettings(true);
document.addEventListener("click", e => { if (!e.target.closest(".settings") && !e.target.closest("#keypill")) toggleSettings(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") toggleSettings(false); });
$("#apikey").addEventListener("input", () => { sessionStorage.setItem("sublattice.key", $("#apikey").value.trim()); keyState(); });

function setTheme(t) {
  if (!["light", "dark", "spin"].includes(t)) t = "light";
  document.documentElement.dataset.theme = t; try { localStorage.setItem("sublattice.theme", t); } catch {}
  document.querySelectorAll("#themes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.theme === t)));
  if (view.chart) view.chart.draw();
  if (view.sweepChart) view.sweepChart.draw();
  for (const c of cardEls.values()) c.chart && c.chart.draw();
}
document.querySelectorAll("#themes button").forEach(b => b.onclick = () => setTheme(b.dataset.theme));

async function loadModels() {
  try {
    const headers = {}, k = $("#apikey").value.trim(); if (k) headers["X-Api-Key"] = k;
    const out = await api("/api/models", {headers}); if (!out.models || !out.models.length) return;
    const sel = $("#model"), keep = localStorage.getItem("sublattice.model") || sel.value || out.default;
    sel.innerHTML = "";
    for (const m of out.models) { const o = document.createElement("option"); o.value = m.id; o.textContent = m.name && m.name !== m.id ? `${m.name} (${m.id})` : m.id; sel.appendChild(o); }
    const other = document.createElement("option"); other.value = "__custom__"; other.textContent = "Other model id…"; sel.appendChild(other);
    sel.title = out.source === "api" ? `${out.models.length} models from your API key` : `Built-in list (could not read your key's models${out.error ? ": " + out.error : ""})`;
    sel.value = [...sel.options].some(o => o.value === keep) ? keep : ([...sel.options].some(o => o.value === out.default) ? out.default : sel.options[0].value);
  } catch {}
}
let modelTimer;
$("#apikey").addEventListener("input", () => { clearTimeout(modelTimer); modelTimer = setTimeout(loadModels, 600); });

async function init() {
  setTheme(document.documentElement.dataset.theme);
  state.config = await api("/api/config");
  PRESETS_FAST.default(); fastUpdate(); setMode(localStorage.getItem("sublattice.mode") === "deep" ? "deep" : "fast");
  const sel = $("#model");
  for (const m of state.config.models) { const o = document.createElement("option"); o.value = o.textContent = m; sel.appendChild(o); }
  sel.value = localStorage.getItem("sublattice.model") || state.config.model;
  sel.onchange = () => {
    if (sel.value === "__custom__") {
      const id = (prompt("Model id, e.g. claude-opus-4-1-20250805") || "").trim();
      if (!id) { sel.value = localStorage.getItem("sublattice.model") || sel.options[0].value; return; }
      const o = document.createElement("option"); o.value = o.textContent = id; sel.insertBefore(o, sel.lastElementChild); sel.value = id;
    }
    localStorage.setItem("sublattice.model", sel.value);
  };
  $("#apikey").value = sessionStorage.getItem("sublattice.key") || ""; keyState(); loadModels();
  if ($("#keypill").classList.contains("need")) toggleSettings(true);
  state.examples = (await api("/api/examples")).examples;
  for (const ex of state.examples) { const o = document.createElement("option"); o.value = o.textContent = ex.name; $("#examples").appendChild(o); }
  try { state.messages = JSON.parse(localStorage.getItem("sublattice.chat") || "[]"); } catch {}
  render(); await refreshRuns();
  const loop = async () => {
    await refreshRuns();
    setTimeout(loop, state.runs.some(r => ["running", "queued"].includes(r.status)) ? 2000 : 10000);
  };
  setTimeout(loop, 2000);
}
init();
</script>
</body>
</html>
